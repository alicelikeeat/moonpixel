name: Windows core library
# The game's core as a Windows DLL for the PC front end (Unreal): MoonPixelBridge.dll, its import library,
# the C header and the Swift runtime DLLs it needs, checked by a C program that calls it as Unreal's plugin
# does (bridge/smoke/smoke.c). Uploaded as the artifact "moonpixel-core-windows". Runs on a push that touches
# the core or the bridge (workflow_dispatch needs the file on the default branch).
on:
  workflow_dispatch:
  push:
    branches: ["claude/keen-maxwell-yxqpz9", "main"]
    paths: ["ios/Sources/**", "ios/Package.swift", "bridge/**", "pc/**", ".github/workflows/windows.yml"]
permissions:
  contents: write
concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dll:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2.1-release
          tag: 6.2.1-RELEASE
      - name: Build the DLL
        working-directory: ios
        shell: pwsh
        run: |
          swift --version
          swift build -c release --product MoonPixelBridge 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem .build\release -Filter "MoonPixelBridge*"
      - name: Call it from C
        shell: pwsh
        run: |
          $rel = "ios\.build\release"
          clang -I bridge\include bridge\smoke\smoke.c "$rel\MoonPixelBridge.lib" -o smoke.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PATH = "$((Resolve-Path $rel).Path);$env:PATH"
          .\smoke.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $out = "moonpixel-core-windows"
          New-Item -ItemType Directory -Force $out, "$out\include", "$out\bin", "$out\lib" | Out-Null
          Copy-Item ios\.build\release\MoonPixelBridge.dll "$out\bin\"
          Copy-Item ios\.build\release\MoonPixelBridge.lib "$out\lib\"
          Copy-Item bridge\include\moonpixel.h "$out\include\"
          # the Swift runtime the DLL links against (shipped beside it in the game)
          $core = (Get-Command swiftCore.dll -ErrorAction SilentlyContinue).Source
          if (-not $core) { $core = (Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs\Swift" -Filter swiftCore.dll | Select-Object -First 1).FullName }
          $rt = Split-Path $core
          Get-ChildItem $rt -Filter *.dll | Copy-Item -Destination "$out\bin\"
          Get-ChildItem "$out\bin"
      - uses: actions/upload-artifact@v4
        with:
          name: moonpixel-core-windows
          path: moonpixel-core-windows
      - name: PC package (the Unreal project with the core in place)
        shell: pwsh
        run: |
          $pkg = "MoonPixel-PC"
          Copy-Item -Recurse pc\MoonPixel $pkg
          Copy-Item -Recurse -Force moonpixel-core-windows\* "$pkg\ThirdParty\MoonPixelCore\"
          Copy-Item pc\README.md "$pkg\README.md"
          Compress-Archive -Path $pkg -DestinationPath MoonPixel-PC.zip
      - name: Publish the PC package (pre-release pc-latest, replaced on every build)
        if: github.ref == 'refs/heads/claude/keen-maxwell-yxqpz9' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create pc-latest MoonPixel-PC.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MoonPixel PC (Unreal project, latest build)" \
            --notes "The Unreal project for Windows with the game's core built in. How to open it: README.md inside (Chinese). Built from ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-log
          path: ios/build.log
