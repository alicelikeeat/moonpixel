name: 3D view check
# Checks the 3D view on its working branch without publishing anything: the simulator build, the UI
# tests (2D and 3D) and screenshots of the 3D view. Pictures come from a simulator on a CI Mac, not
# from a device. Releases are still made only by ios.yml.
on:
  workflow_dispatch:
  push:
    branches: ["claude/upbeat-gates-vu0ssd"]
    paths: ["ios/**", "content/**", ".github/workflows/solid.yml"]
permissions:
  contents: write     # only to keep the screenshots on this branch (docs/media/3d)
concurrency:
  group: solid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Simulator build
        working-directory: ios
        run: |
          xcodegen generate
          set +e
          xcodebuild -project MoonPixel.xcodeproj -scheme MoonPixel -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ddsim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build > simbuild.log 2>&1; rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" simbuild.log | cut -c1-400 | sort -u | head -60
          grep -E "Solid3D.swift.*warning:" simbuild.log | cut -c1-300 | sort -u | head -20
          exit $rc
      - name: Screenshots of the 3D view (simulator)
        working-directory: ios
        run: |
          set +e
          APP=$(find build/ddsim/Build/Products -maxdepth 2 -name "*.app" | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']]; print(c[0]['udid']); sys.stderr.write(c[0]['name']+'\n')" 2> device.txt)
          echo "device: $(cat device.txt)"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          xcrun simctl install "$UDID" "$APP"
          shot() { xcrun simctl io "$UDID" screenshot "$1" > /dev/null 2>&1; }
          run() { xcrun simctl terminate "$UDID" org.moonpixel.game > /dev/null 2>&1; xcrun simctl launch "$UDID" org.moonpixel.game "$@"; }
          run --autostart 7 --2d; sleep 30; shot solid-0-flat.png
          run --autostart 7 --3d --perf; sleep 40; shot solid-1-start.png
          run --autostart 7 --3d --demo-city; sleep 22; shot solid-2-city.png
          run --autostart 7 --3d --demo-war; sleep 60; shot solid-3-war.png
          run --autostart 7 --3d --storm; sleep 16; shot solid-4-storm.png
          run --autostart 7 --3d --storey-demo; sleep 30; shot solid-11-storeys.png
          run --autostart 7 --2d --storey-demo; sleep 25; shot solid-12-storey-flat.png
          # the nanite swarm (2^20 points on the GPU): one cast every 10 s from the 8th second; pictures at the ball, the giant, the wolf, the helix
          # (a cast every 10 s for two minutes; the simulator's own delays decide which shape each picture catches)
          run --autostart 7 --3d --demo-swarm; sleep 20; for i in 5 6 7 8; do shot solid-$i-swarm.png; sleep 3; done
          run --autostart 7 --2d --demo-swarm; sleep 22; shot solid-9-swarm-flat.png; sleep 3; shot solid-10-swarm-flat.png
          # command mode: the computer plays both sides at three times the speed
          run --autostart 7 --2d --command-auto; sleep 30; shot command-1.png; sleep 25; shot command-2.png; sleep 25; shot command-3.png
          # metro mode: a ready-made town at full speed, then the traffic and land-value views
          run --autostart 7 --2d --metro-auto; sleep 45; shot metro-1.png; sleep 30; shot metro-2.png
          run --autostart 7 --2d --metro-auto --metro-view traffic; sleep 50; shot metro-3-traffic.png
          run --autostart 7 --2d --metro-auto --metro-view value; sleep 50; shot metro-4-value.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          ls -la solid-*.png
          echo "===== crash reports ====="
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i moonpixel | head
          echo "===== app log (errors and faults, most frequent first) ====="
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "MoonPixel" AND (messageType == error OR messageType == fault)' | cut -c40-260 | sort | uniq -c | sort -rn | head -14
      - name: Keep the pictures on the branch
        if: always() && github.event_name == 'push'
        run: |
          # the pictures are made aside, then laid over the branch as it is at the moment of pushing
          # (another run may have pushed pictures of the same names meanwhile: newest wins, no merge)
          out=$(mktemp -d)
          for f in ios/solid-*.png ios/command-*.png ios/metro-*.png ios/ui-3d-*.png ios/ui-cmd-*.png ios/ui-metro-*.png; do
            [ -f "$f" ] || continue
            sips -Z 1280 -s format jpeg -s formatOptions 70 "$f" --out "$out/$(basename "${f%.png}").jpg" > /dev/null 2>&1
          done
          ls "$out" | grep -q . || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            mkdir -p docs/media/3d && cp "$out"/*.jpg docs/media/3d/
            git add docs/media/3d
            git diff --cached --quiet && exit 0
            git commit -q -m "3D view: simulator pictures from CI run $GITHUB_RUN_NUMBER ($GITHUB_JOB)"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-shots
          path: |
            ios/simbuild.log
            ios/solid-*.png
            ios/command-*.png
            ios/metro-*.png

  ui:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: brew install xcodegen
      - name: Simulator build and UI tests
        working-directory: ios
        run: |
          xcodegen generate
          set +e
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']]; print(c[0]['udid']); sys.stderr.write(c[0]['name']+'\n')")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          xcodebuild test -project MoonPixel.xcodeproj -scheme MoonPixel -destination "id=$UDID" -derivedDataPath build/ddtest \
            -resultBundlePath ui.xcresult -retry-tests-on-failure -test-iterations 2 CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO > uitest.log 2>&1; rc=$?
          grep -E "UITEST|error:|XCTAssert|Test Case|passed|failed|TEST (SUCCEEDED|FAILED)" uitest.log | cut -c1-300 | sort -u | head -80 | tee ui-result.txt
          mkdir -p uishots && xcrun xcresulttool export attachments --path ui.xcresult --output-path uishots > /dev/null 2>&1
          python3 -c "
          import json,shutil
          for t in json.load(open('uishots/manifest.json')):
              for a in t.get('attachments', []):
                  name = a.get('suggestedHumanReadableName','x').split('_')[0].split('.')[0]
                  name = ''.join(ch if ch.isalnum() or ch in '-' else '-' for ch in name)[:60]
                  shutil.copy('uishots/' + a['exportedFileName'], 'ui-' + name + '.png')
          " 2>/dev/null; ls ui-*.png 2>/dev/null
          echo "===== result ====="; grep -E "Test Case.*(passed|failed)|XCTAssert|TEST (SUCCEEDED|FAILED)|error:" uitest.log | cut -c1-260 | sort -u | tail -30
          exit $rc
      - name: Keep the pictures on the branch
        if: always() && github.event_name == 'push'
        run: |
          # the pictures are made aside, then laid over the branch as it is at the moment of pushing
          # (another run may have pushed pictures of the same names meanwhile: newest wins, no merge)
          out=$(mktemp -d)
          for f in ios/solid-*.png ios/command-*.png ios/metro-*.png ios/ui-3d-*.png ios/ui-cmd-*.png ios/ui-metro-*.png; do
            [ -f "$f" ] || continue
            sips -Z 1280 -s format jpeg -s formatOptions 70 "$f" --out "$out/$(basename "${f%.png}").jpg" > /dev/null 2>&1
          done
          ls "$out" | grep -q . || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            mkdir -p docs/media/3d && cp "$out"/*.jpg docs/media/3d/
            git add docs/media/3d
            git diff --cached --quiet && exit 0
            git commit -q -m "3D view: simulator pictures from CI run $GITHUB_RUN_NUMBER ($GITHUB_JOB)"
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-ui-tests
          path: |
            ios/uitest.log
            ios/ui-result.txt
            ios/ui-*.png
