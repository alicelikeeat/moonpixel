name: iOS unsigned IPA
# Native Swift app (SpriteKit 2D / RealityKit 3D + SwiftUI Liquid Glass). Builds an UNSIGNED .ipa:
# sign it yourself (Xcode, AltStore, Sideloadly, ...) before installing.
#
# Blocking (a release is only published when all of these pass):
#   core   - every MoonPixelCore test (swift test)
#   ui     - device build and unsigned IPA, then the simulator build and the UI tests (a test that fails is run once more; failing twice fails the run)
# Then:
#   release - publishes the IPA as vMAJOR.N: N = last published MAJOR.N + 1, starting at 0 for a new
#             major (2.0, 2.1, ...); failed runs take no number. 1.x ended at v1.9; 2.0 is the 3D view.
# Auxiliary (never blocks, uploads to the release it belongs to):
#   media  - screenshots, recordings and frame-time readings from the simulator (not a device)
# Every job keeps its full log as an artifact, pass or fail.
on:
  workflow_dispatch:
  push:
    branches: ["claude/moonpixel-v1-full-spec-fze5jp", "claude/keen-maxwell-yxqpz9", "main"]
    paths: ["ios/**", "content/**", "tools/gen_swift_content.py", ".github/workflows/ios.yml"]
permissions:
  contents: write
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        working-directory: ios
        run: |
          set +e
          swift test -c release -Xswiftc -enable-testing > core-tests.log 2>&1; rc=$?
          grep -E "error|failed|Executed|CYCLE|REPEAT|BENCH|STRESS|signal|Fatal" core-tests.log | cut -c1-300 | tail -60
          [ $rc -eq 0 ] || tail -40 core-tests.log | cut -c1-300
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: log-core-tests, path: ios/core-tests.log }

  # the device build and the IPA run in the same job as the UI tests: a separate macOS job for them was
  # repeatedly left without a runner and cancelled, which blocked every release
  ui:
    runs-on: macos-latest
    needs: core
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every published release gets the next minor version of the current major: 2.0, 2.1, 2.2 ...
          # (the first of a major is .0; failed runs take no number)
          MAJOR=2
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | sed -n "s/^v${MAJOR}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -1)
          if [ -z "$LAST" ]; then NEXT=0; else NEXT=$(( LAST + 1 )); fi
          echo "MP_VERSION=$MAJOR.$NEXT" >> "$GITHUB_ENV"
          echo "version=$MAJOR.$NEXT" >> "$GITHUB_OUTPUT"
          echo "version $MAJOR.$NEXT (last published v$MAJOR.${LAST:-none})"
      - name: Build for device without code signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MoonPixel.xcodeproj -scheme MoonPixel -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION="${MP_VERSION}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" build > build.log 2>&1 || { grep -E "error:" build.log | cut -c1-400 | sort -u | head -60; exit 1; }
          grep -E "warning: .*deprecated" build.log | sort -u | head -5 || true
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry MoonPixel-${MP_VERSION}-unsigned.ipa Payload
          ls -la MoonPixel-${MP_VERSION}-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MoonPixel-unsigned-ipa
          path: ios/MoonPixel-${{ env.MP_VERSION }}-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: log-device-build, path: ios/build.log }
      - name: Simulator build and UI tests (blocking)
        working-directory: ios
        run: |
          set +e
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']]; print(c[0]['udid']); sys.stderr.write(c[0]['name']+'\n')")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          xcodebuild test -project MoonPixel.xcodeproj -scheme MoonPixel -destination "id=$UDID" -derivedDataPath build/ddtest \
            -resultBundlePath ui.xcresult -retry-tests-on-failure -test-iterations 2 CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO > uitest.log 2>&1; rc=$?
          grep -E "UITEST|error:|XCTAssert|Test Case|passed|failed|TEST (SUCCEEDED|FAILED)" uitest.log | cut -c1-300 | sort -u | head -60 | tee ui-result.txt
          mkdir -p uishots && xcrun xcresulttool export attachments --path ui.xcresult --output-path uishots > /dev/null 2>&1
          python3 -c "
          import json,shutil
          for t in json.load(open('uishots/manifest.json')):
              for a in t.get('attachments', []):
                  name = a.get('suggestedHumanReadableName','x').split('_')[0].split('.')[0]
                  name = ''.join(ch if ch.isalnum() or ch in '-' else '-' for ch in name)[:60]
                  shutil.copy('uishots/' + a['exportedFileName'], 'ui-' + name + '.png')
          " 2>/dev/null; ls ui-*.png 2>/dev/null
          python3 scripts/crash-report.py || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tests
          path: |
            ios/uitest.log
            ios/ui-result.txt
            ios/ui-*.png

  release:
    runs-on: ubuntu-latest
    needs: [core, ui]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: MoonPixel-unsigned-ipa }
      - uses: actions/download-artifact@v4
        with: { name: ui-tests, path: ui }
      - name: Release notes (what changed since the last release)
        env:
          GH_TOKEN: ${{ github.token }}
          MP_VERSION: ${{ needs.ui.outputs.version }}
        run: |
          git fetch --tags --force > /dev/null 2>&1 || true
          # the last published release before this one, and the commit it was built from
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft -q '.[] | select(.isDraft == false) | .tagName' | grep -E '^v[0-9]+\.[0-9]+$' | sort -t. -k1,1V -k2,2n | tail -1)
          PREV_SHA=$( [ -n "$PREV" ] && git rev-list -n 1 "$PREV" 2>/dev/null || true )
          {
            echo "## MoonPixel ${MP_VERSION} 本版变化 / What changed"
            echo
            if [ -n "$PREV_SHA" ]; then
              # the changelog entries added since the last release (written for players, in Chinese)
              git diff "$PREV_SHA" "$GITHUB_SHA" -- CHANGELOG.md | grep -E '^\+' | grep -vE '^\+\+\+' | sed 's/^+//' > added.md
              if [ -s added.md ]; then cat added.md; else echo "（这一版没有新的更新日志条目，见下方提交记录。）"; fi
              echo
              echo "### 提交记录（自 ${PREV} 起）/ Commits since ${PREV}"
              echo
              git log --no-merges --pretty='- %s (%h)' "$PREV_SHA..$GITHUB_SHA"
            else
              # no earlier release: the newest changelog section
              awk '/^## /{n++} n==1' CHANGELOG.md
            fi
            echo
            echo "---"
            echo "未签名 ipa，需自行签名后安装。核心测试、真机构建与模拟器 UI 测试均通过后才发布；截图、录像与帧时间数据来自模拟器，不是真机。完整历史见仓库里的 CHANGELOG.md。"
            echo "Unsigned IPA: sign it yourself before installing. Published only after the core tests, the device build and the simulator UI tests passed; screenshots, recordings and frame times come from the simulator, not a device. Commit ${GITHUB_SHA}."
          } > notes.md
          # a release body is limited to 125 000 characters
          head -c 120000 notes.md > notes-cut.md
          cat notes-cut.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MP_VERSION: ${{ needs.ui.outputs.version }}
        run: |
          TAG="v${MP_VERSION}"
          gh release create "$TAG" MoonPixel-${MP_VERSION}-unsigned.ipa ui/ui-result.txt $(ls ui/ui-*.png 2>/dev/null) --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MoonPixel ${MP_VERSION} (build ${GITHUB_RUN_NUMBER}, unsigned)" \
            --notes-file notes-cut.md

  media:
    runs-on: macos-latest
    needs: [ui, release]
    continue-on-error: true
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      MP_VERSION: ${{ needs.ui.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: brew install xcodegen
      - name: Screenshots, recordings and frame times (simulator)
        working-directory: ios
        run: |
          set +e
          xcodegen generate
          xcodebuild -project MoonPixel.xcodeproj -scheme MoonPixel -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ddsim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="${MP_VERSION}" build > simbuild.log 2>&1
          echo "===== simulator build ====="; grep -E "error:|BUILD (SUCCEEDED|FAILED)" simbuild.log | cut -c1-300 | sort -u | head -20
          APP=$(find build/ddsim/Build/Products -maxdepth 2 -name "*.app" | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']]; print(c[0]['udid']); sys.stderr.write(c[0]['name']+'\n')" 2> device.txt)
          echo "device: $(cat device.txt) $UDID app: $APP"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          xcrun simctl install "$UDID" "$APP"
          shot() { xcrun simctl io "$UDID" screenshot "$1" > /dev/null 2>&1; }
          run() { xcrun simctl terminate "$UDID" org.moonpixel.game > /dev/null 2>&1; xcrun simctl launch "$UDID" org.moonpixel.game "$@"; }
          run; sleep 14; shot sim-menu.png
          run --autostart 7 --select; sleep 30; shot sim-game.png
          run --autostart 7 --map; sleep 30; shot sim-map.png
          run --autostart 7 --test-photo; sleep 22; shot sim-photo.png
          run --autostart 7 --test-anim; sleep 26; shot sim-anim.png
          run --autostart 7 --realm; sleep 24; shot sim-realm.png
          run --autostart 7 --laws; sleep 24; shot sim-laws.png
          run --autostart 7 --powers; sleep 22; shot sim-powers.png
          run --autostart 7 --storm; sleep 13; shot sim-storm1.png; sleep 2; shot sim-storm2.png; sleep 2; shot sim-storm3.png
          rec() { xcrun simctl io "$UDID" recordVideo --codec h264 --force "$1" > /dev/null 2>&1 & RPID=$!; sleep "$2"; kill -INT $RPID; wait $RPID 2>/dev/null; }
          run --autostart 7 --demo-build; rec rec-build.mp4 42; shot sim-build.png
          run --autostart 7 --demo-city; rec rec-city.mp4 16; shot sim-city.png
          run --autostart 7 --demo-war; rec rec-war.mp4 60; shot sim-war.png
          echo "===== the three nations' capitals (screenshots of the running game) ====="
          run --autostart 7 --tour-cities; sleep 54; shot sim-nation1.png; sleep 8; shot sim-nation2.png; sleep 8; shot sim-nation3.png
          echo "===== frame-time diagnostics (simulator on a CI Mac, not a device) ====="
          DATA() { xcrun simctl get_app_container "$UDID" org.moonpixel.game data; }
          # the same scene twice on this machine: with the v1.6 drawing (roofs, crests, soldier view) and without it
          for mode in full plain; do
            rm -f "$(DATA)/Documents/perf.json"
            extra=""; [ "$mode" = plain ] && extra="--plain-render"
            run --autostart 7 --demo-war --perf --perf-log 10 $extra; sleep 45; shot sim-perf-$mode.png
            cp "$(DATA)/Documents/perf.json" perf-war-$mode.json 2>/dev/null || echo '{"missing":true}' > perf-war-$mode.json
          done
          for n in 50 100 200 400; do
            rm -f "$(DATA)/Documents/perf.json"
            run --autostart 7 --stress-battle $n --perf --perf-log 10; sleep 40; shot sim-stress-$n.png
            cp "$(DATA)/Documents/perf.json" perf-stress-$n.json 2>/dev/null || echo '{"missing":true}' > perf-stress-$n.json
          done
          xcrun simctl terminate "$UDID" org.moonpixel.game
          python3 - <<'PY' | tee perf-summary.txt
          import json, glob
          for f in ["perf-war-full.json", "perf-war-plain.json"] + sorted(glob.glob("perf-stress-*.json"), key=lambda s: int(s.split("-")[2].split(".")[0])):
              d = json.load(open(f))
              if d.get("missing"): print(f, "missing"); continue
              ph, pk = d.get("phases", {}), d.get("peaks", {})
              phases = " ".join(f"{k} {v:.2f}/{pk.get(k,0):.1f}" for k, v in sorted(ph.items()))
              print(f"{f}: {d['device']} p50 {d['p50']:.1f} p95 {d['p95']:.1f} p99 {d['p99']:.1f} ms, long {d['longFrames']}/{d['frames']}, "
                    f"phases(avg/peak ms) {phases}, nodes {d['nodes']}, chunk tex {d['chunkTextureMB']:.0f} MB, mem {d['memoryMB']} MB, speed {d['speedReal']:.1f}/{d['speedWanted']:.0f}")
          PY
          cat device.txt >> perf-summary.txt
          echo "===== app log ====="
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "MoonPixel" AND (messageType == error OR messageType == fault)' | tail -25
          gh release upload "v${MP_VERSION}" sim-*.png perf-*.json perf-summary.txt rec-*.mp4 --repo "$GITHUB_REPOSITORY" --clobber
          ls -la sim-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media
          path: |
            ios/simbuild.log
            ios/perf-*.json
            ios/perf-summary.txt
