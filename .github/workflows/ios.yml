name: iOS unsigned IPA
# Native Swift app (SpriteKit + SwiftUI Liquid Glass). Builds an UNSIGNED .ipa:
# sign it yourself (Xcode, AltStore, Sideloadly, ...) before installing.
on:
  workflow_dispatch:
  push:
    branches: ["claude/moonpixel-v1-full-spec-fze5jp", "main"]
    paths: ["ios/**", "content/**", "tools/gen_swift_content.py", ".github/workflows/ios.yml"]
permissions:
  contents: write
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Core tests
        working-directory: ios
        run: swift test -c release -Xswiftc -enable-testing 2>&1 | grep -E "error|failed|Executed|CYCLE|REPEAT|BENCH" | cut -c1-300 | tail -40; test ${PIPESTATUS[0]} -eq 0
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Version
        run: |
          # every release gets the next minor version: 1.1, 1.2, 1.3 ...
          echo "MP_VERSION=1.$((GITHUB_RUN_NUMBER - 20))" >> "$GITHUB_ENV"
          echo "version 1.$((GITHUB_RUN_NUMBER - 20))"
      - name: Build for device without code signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project MoonPixel.xcodeproj -scheme MoonPixel -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION="${MP_VERSION}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" build > build.log 2>&1 || { grep -E "error:" build.log | cut -c1-400 | sort -u | head -60; exit 1; }
          grep -E "warning: .*deprecated" build.log | sort -u | head -5 || true
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          ls -la "$APP" | head -12
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry MoonPixel-${MP_VERSION}-unsigned.ipa Payload
          ls -la MoonPixel-${MP_VERSION}-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MoonPixel-unsigned-ipa
          path: ios/MoonPixel-${{ env.MP_VERSION }}-unsigned.ipa
          if-no-files-found: error
      - name: Publish GitHub release
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${MP_VERSION}"
          gh release create "$TAG" MoonPixel-${MP_VERSION}-unsigned.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MoonPixel ${MP_VERSION} (build ${GITHUB_RUN_NUMBER}, unsigned)" \
            --notes "原生 Swift 版（SpriteKit + SwiftUI Liquid Glass）。未签名 ipa，需自行签名后安装。 Native Swift build, unsigned: sign it yourself before installing. Commit ${GITHUB_SHA}."
      - name: Smoke test in the iOS Simulator
        working-directory: ios
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          xcodebuild -project MoonPixel.xcodeproj -scheme MoonPixel -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ddsim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="${MP_VERSION}" build > simbuild.log 2>&1
          echo "===== simulator build ====="; grep -E "error:|BUILD (SUCCEEDED|FAILED)" simbuild.log | cut -c1-300 | sort -u | head -20
          APP=$(find build/ddsim/Build/Products -maxdepth 2 -name "*.app" | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']]; print(c[0]['udid']); sys.stderr.write(c[0]['name']+'\n')")
          echo "device: $UDID app: $APP"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          xcrun simctl install "$UDID" "$APP"
          shot() { xcrun simctl io "$UDID" screenshot "$1" > /dev/null 2>&1; }
          xcrun simctl launch "$UDID" org.moonpixel.game; sleep 14; shot sim-menu.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --select; sleep 30; shot sim-game.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --map; sleep 30; shot sim-map.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --test-photo; sleep 22; shot sim-photo.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --test-anim; sleep 26; shot sim-anim.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --realm; sleep 24; shot sim-realm.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --laws; sleep 24; shot sim-laws.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --powers; sleep 22; shot sim-powers.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          xcrun simctl launch "$UDID" org.moonpixel.game --autostart 7 --storm; sleep 13; shot sim-storm1.png; sleep 2; shot sim-storm2.png; sleep 2; shot sim-storm3.png
          xcrun simctl terminate "$UDID" org.moonpixel.game
          echo "===== UI test: tap the HUD buttons ====="
          xcodebuild test -project MoonPixel.xcodeproj -scheme MoonPixel -destination "id=$UDID" -derivedDataPath build/ddtest \
            -resultBundlePath ui.xcresult CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO > uitest.log 2>&1
          grep -E "UITEST|error:|XCTAssert|Test Case|passed|failed|TEST (SUCCEEDED|FAILED)" uitest.log | cut -c1-300 | sort -u | head -60 | tee ui-result.txt
          mkdir -p uishots && xcrun xcresulttool export attachments --path ui.xcresult --output-path uishots > /dev/null 2>&1
          python3 -c "
          import json,shutil
          for t in json.load(open('uishots/manifest.json')):
              for a in t.get('attachments', []):
                  name = a.get('suggestedHumanReadableName','x').split('_')[0].split('.')[0]
                  shutil.copy('uishots/' + a['exportedFileName'], 'ui-' + name + '.png')
          " 2>/dev/null; ls ui-*.png 2>/dev/null
          echo "===== app log ====="
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "MoonPixel" AND (messageType == error OR messageType == fault)' | tail -25
          TAG="v${MP_VERSION}"
          gh release upload "$TAG" sim-menu.png sim-game.png sim-map.png sim-photo.png sim-anim.png sim-realm.png sim-laws.png sim-powers.png sim-storm1.png sim-storm2.png sim-storm3.png ui-result.txt ui-*.png --repo "$GITHUB_REPOSITORY" --clobber
          ls -la sim-*.png
