name: MoonPixel
options:
  bundleIdPrefix: org.moonpixel
  deploymentTarget:
    iOS: "17.0"
packages:
  MoonPixelCore:
    path: .
targets:
  MoonPixel:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MoonPixelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moonpixel.game
        PRODUCT_NAME: MoonPixel
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MoonPixel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  MoonPixelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MoonPixel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moonpixel.game.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoonPixel
schemes:
  MoonPixel:
    build:
      targets:
        MoonPixel: all
        MoonPixelUITests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - MoonPixelUITests
